<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>McFloater Call</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { font-family: system-ui, sans-serif; margin: 0; background: #111; color: #eee; }
  .container { max-width: 1100px; margin: 0 auto; padding: 1rem; }
  h1 { margin: 0 0 1rem; font-size: 1.4rem; }
  .video-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
  video { width: 100%; background: #000; border-radius: 6px; }
  .controls { margin-top: 1rem; display: flex; gap: 0.5rem; flex-wrap: wrap; }
  button { padding: 0.6rem 1.2rem; font-size: 1rem; border: none; border-radius: 6px; cursor: pointer; }
  #start { background: #0a0; color: white; }
  #hangup { background: #a00; color: white; }
  .status { margin-top: 0.5rem; font-family: monospace; font-size: 0.85rem; color: #888; }
  .track-label { font-size: 0.75rem; color: #aaa; margin-bottom: 0.25rem; }

  /* Diagnostic / Telemetry panel */
  .diag-panel {
    margin-top: 1.25rem;
    background: #1a1a1a;
    border: 1px solid #333;
    border-radius: 8px;
    padding: 0.75rem 1rem;
    font-family: ui-monospace, monospace;
    font-size: 0.8rem;
  }
  .diag-title {
    color: #666;
    font-size: 0.7rem;
    letter-spacing: 0.5px;
    margin-bottom: 0.5rem;
    text-transform: uppercase;
  }
  .diag-row {
    display: flex;
    gap: 1.5rem;
    flex-wrap: wrap;
    margin-bottom: 0.35rem;
  }
  .diag-item {
    display: flex;
    align-items: center;
    gap: 0.4rem;
  }
  .diag-label {
    color: #777;
  }
  .diag-value {
    color: #0f0;
    font-weight: 600;
    min-width: 70px;
  }
  .diag-value.bad { color: #f44; }
  .diag-value.warn { color: #fb0; }
  .diag-dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #555;
  }
  .diag-dot.green { background: #0f0; box-shadow: 0 0 6px #0f0; }
  .diag-dot.red { background: #f44; }
  .diag-dot.yellow { background: #fb0; }
  .diag-log {
    margin-top: 0.5rem;
    height: 92px;
    overflow-y: auto;
    background: #111;
    border: 1px solid #222;
    padding: 4px 8px;
    font-size: 0.72rem;
    color: #aaa;
    white-space: pre-wrap;
  }
  .git-id {
    margin-top: 0.4rem;
    font-size: 0.55rem;
    color: #444;
    font-family: ui-monospace, monospace;
    text-align: right;
  }
</style>
</head>
<body>
<div class="container">
  <h1>McFloater — Video Call</h1>

  <div class="video-grid">
    <div>
      <div class="track-label">Remote (Avatar + TTS audio from Thumper)</div>
      <video id="remote-video" autoplay playsinline></video>
    </div>
    <div>
      <div class="track-label">Local (Webcam + Mic)</div>
      <video id="local-video" autoplay playsinline muted></video>
    </div>
  </div>

  <div class="controls">
    <button id="start">Start Call</button>
    <button id="hangup" disabled>Hang Up</button>
  </div>

  <div id="status" class="status">Ready. Click Start Call.</div>

  <div class="diag-panel">
    <div class="diag-title">Diagnostic Mode</div>
    <div class="diag-row">
      <div class="diag-item"><span class="diag-label">WS:</span> <span id="ws-dot" class="diag-dot"></span> <span id="ws-val" class="diag-value"></span></div>
      <div class="diag-item"><span class="diag-label">PC:</span> <span id="pc-dot" class="diag-dot"></span> <span id="pc-val" class="diag-value"></span></div>
      <div class="diag-item"><span class="diag-label">STT:</span> <span id="stt-val" class="diag-value"></span></div>
    </div>
    <div class="diag-log" id="diag-log"></div>
  </div>

  <div class="git-id">b74a316</div>
</div>

<script>
const wsUrl = `ws://${location.host}/ws/call`;
let pc = null;
let ws = null;
let localStream = null;

const remoteVideo = document.getElementById('remote-video');
const localVideo = document.getElementById('local-video');
const statusEl = document.getElementById('status');
const startBtn = document.getElementById('start');
const hangupBtn = document.getElementById('hangup');

function log(msg) {
  statusEl.textContent = msg;
  console.log('[call]', msg);
}

async function startCall() {
  startBtn.disabled = true;
  hangupBtn.disabled = false;

  try {
    // 1. Capture local webcam + mic (browser-only, works on Android)
    localStream = await navigator.mediaDevices.getUserMedia({
      video: { width: { ideal: 1280 }, height: { ideal: 720 } },
      audio: true
    });
    localVideo.srcObject = localStream;

    // 2. Create RTCPeerConnection (avatar video will arrive as a remote track)
    pc = new RTCPeerConnection({
      iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
    });

    // Add local tracks only
    localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

    // Handle remote tracks
    pc.ontrack = (event) => {
      if (event.track.kind === 'video') {
        remoteVideo.srcObject = event.streams[0];
      } else if (event.track.kind === 'audio') {
        // Remote TTS audio will play automatically via the stream
        const audioEl = new Audio();
        audioEl.srcObject = event.streams[0];
        audioEl.play().catch(() => {});
      }
    };

    // 4. Signaling via WebSocket
    ws = new WebSocket(wsUrl);

    ws.onopen = async () => {
      log('Connected to signaling');
      // Create offer
      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);
      ws.send(JSON.stringify({ type: 'offer', sdp: offer.sdp }));
    };

    ws.onmessage = async (event) => {
      const msg = JSON.parse(event.data);
      if (msg.type === 'answer') {
        await pc.setRemoteDescription({ type: 'answer', sdp: msg.sdp });
        log('Call established');
      } else if (msg.type === 'ice') {
        try {
          await pc.addIceCandidate(msg.candidate);
        } catch (e) { /* ignore */ }
      }
    };

    pc.onicecandidate = (ev) => {
      if (ev.candidate && ws && ws.readyState === 1) {
        ws.send(JSON.stringify({ type: 'ice', candidate: ev.candidate }));
      }
    };

    hangupBtn.onclick = hangup;
  } catch (err) {
    log('Error: ' + err.message);
    startBtn.disabled = false;
    hangupBtn.disabled = true;
  }
}

function hangup() {
  if (pc) pc.close();
  if (ws) ws.close();
  if (localStream) localStream.getTracks().forEach(t => t.stop());
  remoteVideo.srcObject = null;
  localVideo.srcObject = null;
  startBtn.disabled = false;
  hangupBtn.disabled = true;
  log('Call ended');
}

startBtn.onclick = startCall;
</script>
</body>
</html>
