[workspace]
resolver = "2"
members = [
    "crates/mcfloater-core",
    "crates/mcfloater-audio",
    "crates/mcfloater-stt",
    "crates/mcfloater-tts",
    "crates/mcfloater-lipsync",
    "crates/mcfloater-render",
    "crates/mcfloater-ha",
    "crates/mcfloater-brain",
    "apps/mcfloater",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/webaugur/McFloater"

[workspace.dependencies]
axum = "0.8"
# Bevy 0.15 on Mesa RADV (FirePro / GCN). Prefer Vulkan; if needed: WGPU_BACKEND=gl
# default-features = false: drop audio/gltf/animation/picking/android — much lighter compiles.
bevy = { version = "0.15", default-features = false, features = [
    "animation",
    "bevy_asset",
    "bevy_color",
    "bevy_core_pipeline",
    "bevy_gltf",
    "bevy_pbr",
    "bevy_render",
    "bevy_scene",
    "bevy_sprite",
    "bevy_state",
    "bevy_text",
    "bevy_ui",
    "bevy_window",
    "bevy_winit",
    "default_font",
    "jpeg",
    "multi_threaded",
    "png",
    "tonemapping_luts",
    "wayland",
    "x11",
] }
cpal = "0.15"
clap = { version = "4", features = ["derive"] }
dotenvy = "0.15"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rubato = "0.15"
crossbeam-channel = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

mcfloater-core = { path = "crates/mcfloater-core" }
mcfloater-audio = { path = "crates/mcfloater-audio" }
mcfloater-stt = { path = "crates/mcfloater-stt" }
mcfloater-tts = { path = "crates/mcfloater-tts" }
mcfloater-lipsync = { path = "crates/mcfloater-lipsync" }
mcfloater-render = { path = "crates/mcfloater-render" }
mcfloater-ha = { path = "crates/mcfloater-ha" }
mcfloater-brain = { path = "crates/mcfloater-brain" }