# ESPHome configuration for KMC 3-outlet power strip with power monitoring (TYWE3S / ESP-12E)
#
# Device: KMC 3-outlet smart power strip / power board
#         TYWE3S or ESP-12E module + energy metering chip (typically BL0937)
# Features: 3 individually switched outlets, power/energy monitoring, 1 button
# Target: Local LAN control via Home Assistant (no cloud)
#
# Flashing method: Serial (USB-UART 3.3 V) — see README.md for wiring and esphome run.
#
# GPIO mapping (common for these 3-outlet boards — VERIFY with multimeter):
#   Relays:     GPIO4, GPIO5, GPIO12
#   Button:     GPIO0 (or GPIO3 / GPIO13)
#   Status LED: GPIO2 (inverted) or GPIO16
#   Metering:   BL0937 on CF=GPIO14, CF1=GPIO13, SEL=GPIO15 (or similar)
#
# Power monitoring is enabled by default in this file.

esphome:
  name: kmc-3outlet-01
  friendly_name: "KMC 3-Outlet Strip"

esp8266:
  board: esp12e

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "KMC-3Out-01 Fallback"
    password: !secret fallback_ap_password

captive_portal:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  platform: esphome
  password: !secret ota_password

logger:
  baud_rate: 115200

status_led:
  pin:
    number: GPIO2
    inverted: true

# --- 3 RELAYS / OUTLETS ---
switch:
  - platform: gpio
    name: "KMC Outlet 1"
    id: outlet1
    pin: GPIO4                    # <-- VERIFY
    restore_mode: RESTORE_DEFAULT_OFF
    icon: "mdi:power-socket-us"

  - platform: gpio
    name: "KMC Outlet 2"
    id: outlet2
    pin: GPIO5                    # <-- VERIFY
    restore_mode: RESTORE_DEFAULT_OFF
    icon: "mdi:power-socket-us"

  - platform: gpio
    name: "KMC Outlet 3"
    id: outlet3
    pin: GPIO12                   # <-- VERIFY
    restore_mode: RESTORE_DEFAULT_OFF
    icon: "mdi:power-socket-us"

# --- SINGLE BUTTON ---
binary_sensor:
  - platform: gpio
    name: "KMC 3-Outlet Button"
    pin:
      number: GPIO0               # <-- VERIFY
      mode: INPUT_PULLUP
      inverted: true
    on_press:
      - switch.toggle: outlet1
    filters:
      - delayed_on: 50ms
      - delayed_off: 50ms

# --- POWER / ENERGY MONITORING (BL0937 or HLW8012) ---
# This section is enabled for the KMC 3-outlet model.
# Pin numbers are the most common ones seen on these boards.
# Adjust cf_pin, cf1_pin, sel_pin after probing if needed.
sensor:
  - platform: hlw8012
    model: BL0937
    cf_pin: GPIO14                # CF / power pulse
    cf1_pin: GPIO13               # CF1 / voltage or current pulse
    sel_pin: GPIO15               # SEL / current/voltage select
    current_resistor: 0.001 ohm
    voltage_divider: 2351
    current:
      name: "KMC Current"
      unit_of_measurement: "A"
    voltage:
      name: "KMC Voltage"
      unit_of_measurement: "V"
    power:
      name: "KMC Power"
      unit_of_measurement: "W"
    energy:
      name: "KMC Energy"
      unit_of_measurement: "kWh"
      accuracy_decimals: 3
    update_interval: 10s

  # Diagnostics
  - platform: uptime
    name: "KMC 3-Outlet Uptime"
  - platform: wifi_signal
    name: "KMC 3-Outlet WiFi Signal"
    update_interval: 60s

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "KMC 3-Outlet IP"
    ssid:
      name: "KMC 3-Outlet SSID"

# --- McFloater integration ---
# Three switch entities + power sensors will appear in Home Assistant.
# Once present, ha_control_ok becomes true and the brain can control the outlets
# and read live power data.